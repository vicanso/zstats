name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full gate: fmt + clippy + feature matrix + cross targets + tests —
  # exactly `make check`, so CI can never fail on anything the local
  # gate would not. Warnings-as-errors is already enforced where the
  # gate intends it (clippy -D warnings, check-targets RUSTFLAGS); no
  # extra global RUSTFLAGS here or CI would be stricter than local.
  check:
    name: check (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.95.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          # Pre-install the cross-check targets; the Makefile's own
          # idempotent `rustup target add` then no-ops
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: make check
        run: make check
