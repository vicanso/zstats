[package]
name = "zstats"
version = "0.5.4"
edition = "2024"
# sysinfo 0.39 requires Rust 1.95+
rust-version = "1.95.0"
license = "Apache-2.0"
description = "Unified, extensible core for system performance metrics collection (embeddable as a library or runnable as a CLI tool)"
repository = "https://github.com/vicanso/zstats"
homepage = "https://github.com/vicanso/zstats"
readme = "README.md"
keywords = ["metrics", "sysinfo", "monitoring", "cli", "system"]
categories = ["command-line-utilities", "os"]

[features]
default = ["cli"]
# Async scheduling and output (Scheduler / MetricSink / LocalChannelSink /
# StdoutSink; pulls in tokio etc.); without it only synchronous collection
# (LocalCollector) remains, for embedders that drive their own scheduling
runtime = [
    "dep:async-trait",
    "dep:tokio",
    "dep:tracing",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
# Load CollectorConfig from a config directory's config.toml
config = ["dep:toml"]
# Typed client for the daemon's Unix-socket protocol (attach / stop) —
# shared by the CLI and any other frontend (unix only, no runtime needed:
# the caller drives the connection from its own tokio runtime)
client = ["dep:tokio", "tokio/net", "tokio/io-util"]
# Frontend building blocks shared by the CLI and any GUI: the alert rule
# engine, rolling per-process averages, the daily metrics history, and
# the full config.toml model (settings). Sync only — no tokio
frontend = ["config", "dep:tracing"]
# CLI tool (the bin is bound to this feature via required-features)
cli = [
    "client",
    "config",
    "frontend",
    "runtime",
    "dep:libc",
    "dep:tracing-subscriber",
    "dep:unicode-width",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/net",
    "tokio/process",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
snafu = "0.9.2"
starship-battery = "0.11.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", optional = true }
toml = { version = "1.1.4", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Safe sysctl access (P/E core topology, memory pressure) — keeps the
# library free of unsafe code (#![forbid(unsafe_code)])
sysctl = "0.7.1"
# Safe `proc_pid_rusage` for the per-process physical footprint. Same
# rationale as `sysctl`: the FFI lives in the dependency, keeping
# `forbid(unsafe_code)` intact. The cost is real and considered: libproc
# generates its bindings with bindgen at build time, so macOS builds
# need libclang — which the Xcode CLT that any macOS build already
# requires does provide. The lighter `darwin-libproc` (hand-written
# bindings, no bindgen) is unmaintained and pins `memchr ~2.3`, which
# collides with sysinfo's `^2.5` — it cannot resolve in this tree.
libproc = "0.14"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[bin]]
name = "zstats"
path = "src/bin/zstats/main.rs"
required-features = ["cli"]

# Skeleton of a single-process frontend (tray GUI) embedding collection —
# the compile-checked reference for the `frontend` feature set
[[example]]
name = "embedded"
required-features = ["frontend", "client"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
