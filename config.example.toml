# zstats configuration reference.
#
# Live location: <config-dir>/config.toml (default ~/.zstats/config.toml;
# override with --config-dir). Every key is optional — a missing key uses
# the builtin default shown here. The file is usually managed through
# `zstats -add <key> <value>` / `-remove <key>` / `-list`, but editing it
# by hand is fine.
#
# Durations accept "500ms", "2s", "5m", "1h", or a bare integer meaning
# milliseconds. A cadence of "0s" means "refresh on every collect".
#
# `zstats serve` reads everything below; the foreground live view (bare
# `zstats`) uses only the [collector] on/off toggles and forces every
# cadence to a fixed 2s beat. The [alerts] section is hot-reloaded by a
# running daemon within ~30 collects; other changes need a daemon restart.

[collector]
# ------------------------------------------------------------------ processes
# Process table collection (the PROC view and per-process alerting)
collect_processes = true
# How often to walk the full process table. "0s" = every collect; the
# daemon defaults to "10s" when left at zero (cuts steady-state CPU from
# ~1.3% to ~0.45% on a 12-core laptop)
process_refresh_interval = "0s"
# While overall load is at least this many logical cores of work, the
# process list refreshes every collect regardless of the cadence above —
# busy periods get precise attribution. Core units; scales with machine
# size. Default 2.0: a modern desktop's ambient load is already ~1 core,
# so this means "ambient plus a whole extra core of anomaly" (1.0 would
# keep the boost pinned on during any working session). 0 disables
process_boost_cpu_cores = 2.0
# Kept processes; the budget is split between top-by-CPU and top-by-memory
# so idle memory hogs stay visible
max_processes = 50
# Per-process disk read/write rates (extra refresh cost on every pass)
collect_process_disk_io = false
# Per-application aggregates over whole process trees (root = child of
# launchd, e.g. Chrome + all its helpers as one entry). One in-memory
# pass during the process refresh, capped at max_processes groups
collect_process_groups = true

# ------------------------------------------------------------------------ cpu
# Per-core usage list in snapshots (overall usage is always collected)
per_core_cpu = true
# CPU frequency changes slowly; refreshing it every collect is wasted work
cpu_frequency_refresh_interval = "30s"

# ---------------------------------------------------------------------- disks
collect_disks = true
# Disk sampling cadence (IO counters + snapshot rebuild)
disk_io_refresh_interval = "0s"
# Capacity (statfs) is ~25x more expensive than IO counters and barely
# changes — it throttles separately underneath the disk cadence. A volume
# that just appeared is read right away regardless, since a new mount has
# no capacity at all until its first storage read
disk_storage_refresh_interval = "1m"
# Collapse APFS synthetic mounts (e.g. "/" and "/System/Volumes/Data")
# into one entry per device name, preferring the shortest mount point
dedupe_disks = true

# ------------------------------------------------------------------- networks
collect_networks = true
network_refresh_interval = "0s"

# -------------------------------------------------------------------- battery
# Charge, health (wear), cycle count, temperature and present power flow.
# Machines without a battery report nothing; costs one IOKit read per
# refresh. Charge moves slowly — only plugging in changes state abruptly,
# and a few seconds of lag there is harmless
collect_battery = true
battery_refresh_interval = "30s"

# --------------------------------------------------------------- temperatures
# Hardware sensors via sysinfo Components; platform-dependent, implausible
# firmware readings are filtered out
# Default true, except on Windows: the reading there goes through WMI,
# which calls CoInitializeEx on the collector thread and sets a
# process-global CoInitializeSecurity — an integration hazard for an
# embedded frontend, in exchange for at most one sensor labelled
# "Computer". Set it explicitly if you want it there
collect_temperatures = true
temperature_refresh_interval = "15s"

# ----------------------------------------------------------------------- misc
# Hard cap for one collect pass (guards against platform calls that hang)
collect_timeout = "2s"

# Custom host labels attached to every snapshot (for multi-machine setups)
[collector.labels]
# env = "home"
# role = "laptop"

[daemon]
# Collection interval for `zstats serve`
interval = "2s"
# How much snapshot history the daemon keeps for `zstats attach` replay
history = "5m"
# serve detaches into the background by default; set false (or pass
# --foreground) to keep it in the terminal
detach = true

[alerts]
# The base cpu/mem thresholds below also drive metrics recording: once a
# minute the daemon appends processes exceeding either base value to
# <config-dir>/data/YYYY-MM-DD.jsonl (per-process overrides only silence
# the notification, not the recording); files older than 30 days are
# cleaned up daily.
#
# CPU threshold in single-core units (100 = one full core; same scale as
# the PROC table). Two tiers share it, and one cooldown covers both:
#   chronic: 5-minute average >= this value ("quietly always busy" —
#            self-limiting bursts like an editor re-indexing never last
#            that long)
#   runaway: 1-minute average >= 3x this value (fast notification)
# Per-process overrides scale both tiers. 0 disables the rule
cpu = 30.0
# Notification when a process's 5-minute average memory reaches the bar
# below (no runaway tier — transient legitimate spikes must not alert).
#
# The bar is the LOWER of these two, because neither works alone:
#   mem        percent of total RAM — protects small machines, where any
#              fixed byte count would be too high to ever fire
#   mem_bytes  an absolute ceiling — protects large machines, where 25%
#              is 16 GiB on a 64 GiB box and nothing reaches it until
#              long after the machine is already swapping
# So an 8 GiB laptop alerts at 2 GiB (the percentage) and a 64 GiB
# workstation at 4 GiB (the ceiling). `mem = 0` disables the rule
# entirely; `mem_bytes = 0` only removes the ceiling. A per-process
# override replaces BOTH halves — it is a request, not a default.
#
# Measured as the physical footprint where macOS provides one (what
# Activity Monitor bills), not the resident size: a language server can
# read 0.2 GiB of RSS and 3 GiB of footprint, the rest compressed. That
# also means a fixed byte bar catches about three times as many
# processes as the same number would under RSS — which is why the
# ceiling is 4 GiB rather than the 2 GiB an 8 GiB machine implies.
mem = 25.0
mem_bytes = "4GiB"

# Whole-application rules, evaluated over process TREES (see
# collect_process_groups): a browser split across 37 helpers can hold
# gigabytes and several cores while no single member trips the
# per-process rules above. Chronic only (5-minute average) — a runaway
# member is already the per-process runaway tier's job. 0 disables
app_cpu = 200.0
# app_mem has the same two halves as mem above, for the same reason: 40%
# is 9.6 GiB on a 24 GiB laptop and 25.6 GiB on a 64 GiB desktop, so the
# percentage alone put the rule out of reach on exactly the machines that
# run those browsers. The effective bar is the lower of the two, and both
# are measured on the group's summed physical footprint
app_mem = 40.0
app_mem_bytes = "8GiB"

# Notification when a volume's used capacity crosses this percentage.
# Crossing-based, not windowed: fires once, stays silent while the disk
# remains full, re-arms after dropping 5 points below. 0 disables
disk = 90.0
# System memory-pressure alert, driven by the kernel's own verdict
# (macOS). Which verdict is worth interrupting for:
#   "off"       never
#   "warning"   (default) warning and worse
#   "critical"  only critical — the right setting on a memory-heavy
#               machine that sits at warning as its normal state
# Alerts only once the level PERSISTS: 5 minutes for warning, 1 minute
# for critical (more severe, faster notification). Escalation from
# warning to critical within the same episode notifies immediately.
# The episode is symmetric — it ends only after 5 minutes of continuous
# normal, so the brief dips a machine sitting near the line makes all
# day cannot turn one condition into a stream of "new" alerts. While it
# holds, reminders back off: 30 min, 1 h, 2 h, then every 4 h, each one
# marked "still going" rather than posing as a fresh event. This is the
# only rule that keeps reminding — memory pressure is a machine state
# you may not be able to fix, not a process you can kill.
# Every one of these alerts NAMES the biggest memory holders (whole
# applications where process groups are collected, individual processes
# otherwise) — the level tells you the machine is in trouble, the names
# tell you what to close. Not configurable: it is the top 3 above 5% of
# RAM, and a bar you could raise would silence the list exactly when
# every consumer is medium-sized, which is when the names help most.
# `true`/`false` still parse
pressure = "warning"
# Minimum time between EPISODES for the same process and rule. A
# condition that simply persists notifies once, plus exactly one
# follow-up if it is still true 30 minutes later (insurance against the
# first notification being missed — macOS defers notifications behind
# Focus modes and summaries). The episode ends when the value falls back
# under the threshold (or the process exits); this value then floors how
# soon the next one may notify, so a value straddling the line cannot
# alert on every crossing
cooldown = "10m"

# Apply the builtin per-app override template beneath your own overrides.
# Precedence per name: your override > template entry > the base `cpu`
# value above. Set false for a pure user config
template = true

# Per-process threshold overrides (case-insensitive process names).
# A higher bar for apps that are legitimately busy in your workflow —
# unlike an ignore list, a real runaway still alerts. 0 disables the
# rule for that process only. Overrides silence the notification but the
# data point is still recorded in <config-dir>/data/.
#
# Only processes that can outlive the 50s alert window need overrides —
# anything shorter never notifies anyway. The dividing line for 0 is WHO
# ASKED: you typed the build command, so a busy compiler tells you
# nothing, while a background indexer pegged for minutes is a real
# failure and keeps a raised bar instead of an exemption.
#
# A key may lead and/or end with `*` to claim a family of names —
# "rust-analyzer*", "*Helper (Renderer)", "*python*". Use it when the
# name is not stable: tool managers stamp the version into the binary
# itself, so an exact key silently stops matching after every update.
# A `*` anywhere else is an error rather than a literal. Precedence when
# several keys match: your own entries beat the builtin template, an
# exact name beats a pattern, and a longer pattern beats a shorter one.
# From a shell, quote it: `zstats -add alert-cpu 'rust-analyzer*=200'`.
#
# The builtin template (default on, see above) lives in the source tree
# as `templates/alerts-macos.toml`, `-linux.toml` and `-windows.toml`,
# one of which is compiled in — a couple of hundred entries each,
# covering browsers, Electron apps, IDE indexers, toolchains and the
# platform's own periodic maintenance. Process names are not portable,
# which is why there is one file per platform. It used to be reproduced
# here, which meant keeping two copies in sync by hand; read the file
# for your platform instead.
#
# To ADD an entry, put it below — a user override outranks the template
# whatever the template says. To REPLACE the table wholesale (for
# example from a copy you refresh on a schedule), drop your own file at
# <config-dir>/template.toml; the daemon picks it up within about a
# minute, no restart:
#
#     curl -fsS -o ~/.zstats/template.toml https://example.com/alerts.toml
#
# Values: 100 = "only interrupt me at a full core", 200 = "multi-core is
# its job", 0 = "never interrupt, still record".
[alerts.cpu_overrides]
# ghostty = 100.0
# "rust-analyzer*" = 200.0

# Do NOT blanket-override interpreters like node/python/java — half the
# real runaways are one of those (and tsserver/pyright/Gradle hide behind
# them); override the specific app instead. Vendors rename helper
# processes across versions: confirm the live name with `zstats --json`
# before adding an override.

[alerts.mem_overrides]
# An entry here replaces BOTH halves of the bar for that name, so 30
# means "judge it by share of the machine, no absolute ceiling" — the
# same tier the builtin template uses for browsers, IDEs and language
# servers. 0 means never interrupt (the data point is still recorded)
# "Google Chrome" = 30.0
# qemu-system-aarch64 = 0.0

# Per-volume disk overrides by mount point. Backup volumes (Time
# Machine) run near-full by design — silence them with 0
[alerts.disk_overrides]
# "/Volumes/Backup" = 0.0

# Per-application overrides for the whole-app rules, keyed by the group's
# ROOT process name — not the process name. Check `zstats --json` first:
# on macOS every terminal session's descendants group under a `login`
# root, so "the cargo build I started" is a `login` group, not `ghostty`.
#
# The builtin app template (same `template` switch as above, and the
# `[app_cpu]` / `[app_mem]` tables of the same per-platform file)
# already covers the two cases that matter: terminal sessions and VM
# hosts are silenced (0 — you started that work, and its members still
# have per-process rules), browsers and IDEs get a raised bar rather than
# an exemption.
[alerts.app_cpu_overrides]
# zed = 400.0

[alerts.app_mem_overrides]
# "Google Chrome" = 60.0
